# Nightly data update for the S7+ Central Asia Tracker.
#
# Every night at midnight New York time this job:
#   1. downloads the "Incidents - Global" tab of the Google Sheet as CSV,
#   2. runs tools/update_data.py, which checks every row and the batch as a
#      whole (see that file for the rules),
#   3. commits the new data/incidents.json + data/update-report.json, and
#   4. asks GitHub Pages to republish the site.
#
# Rows with mistakes are simply held back: no alert (expected day to day).
# If the WHOLE update is stopped (download failed, a column was renamed,
# most rows suddenly invalid, many incidents vanished), nothing is
# published, the site keeps yesterday's data, and the person below is
# alerted: an issue is opened and assigned to them (GitHub emails it), plus
# a direct email if mail settings are configured (see README).
#
# Run it by hand any time: Actions tab > "Nightly data update" > Run workflow.

name: Nightly data update

on:
  schedule:
    # GitHub schedules run in UTC. Midnight in New York is 04:00 UTC in
    # summer (EDT) and 05:00 UTC in winter (EST), so run at both and let the
    # first step skip the one that isn't midnight locally.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the new data
  issues: write     # open/close the failure alert
  pages: write      # request a Pages rebuild

concurrency:
  group: nightly-data
  cancel-in-progress: false

env:
  ALERT_GITHUB_USER: sdittgennewlines            # gets the failure issue (and GitHub's email)
  ALERT_EMAIL: sdittgen@newlinesinstitute.org    # gets a direct email if mail secrets are set
  ALERT_LABEL: data-update-failed

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}   # empty unless mail is configured
    steps:
      - uses: actions/checkout@v4

      - name: Only run once, just after midnight New York time (or when started by hand)
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%-H)
          today=$(TZ=America/New_York date +%F)
          last=$(python3 -c "import json;print(json.load(open('data/update-report.json')).get('updatedAt','')[:10])" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 4 ] && [ "$last" != "$today" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping this trigger (New York hour $hour; last update $last)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Download the sheet and check it
        id: update
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python3 tools/update_data.py 2>&1 | tee update.log

      - name: Publish the new data
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "s7-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/update-report.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Nightly data update: $(head -n1 update.log)"
            git push
          fi
          # Ask GitHub Pages to rebuild (harmless if a build is already queued).
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "Pages rebuild request skipped."

      - name: Close any open failure alert (the update worked)
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label "$ALERT_LABEL" --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Resolved: the nightly update on $(TZ=America/New_York date '+%b %-d, %Y') succeeded."
          done

      # ------------------------------------------------ alerts on total failure

      - name: Open (or update) a failure alert
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reason=$(grep -A5 "UPDATE STOPPED" update.log 2>/dev/null || echo "The job failed before the checks ran. See the run log.")
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "The nightly data update was **stopped**. The site is still showing the previous day's data." \
            '```' "$reason" '```')
          body="$body"$'\n\n'"Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n'"Fix the sheet, then re-run: Actions > Nightly data update > Run workflow."
          gh label create "$ALERT_LABEL" --color B60205 --description "Nightly data update stopped" --force >/dev/null
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly data update stopped" --label "$ALERT_LABEL" \
              --assignee "$ALERT_GITHUB_USER" --body "$body"
          fi

      - name: Email the alert directly (only if mail secrets are configured)
        if: failure() && steps.gate.outputs.run == 'true' && env.MAIL_SERVER != ''
        env:
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          reason = open("update.log").read() if os.path.exists("update.log") else "The job failed before the checks ran."
          msg = EmailMessage()
          msg["Subject"] = "S7+ tracker: nightly data update stopped"
          msg["From"] = os.environ["MAIL_USERNAME"]
          msg["To"] = os.environ["ALERT_EMAIL"]
          msg.set_content(f"The nightly update was stopped; the site still shows the previous day's data.\n\n{reason}\n\nRun log: {os.environ['RUN_URL']}\n")
          with smtplib.SMTP(os.environ["MAIL_SERVER"], int(os.environ.get("MAIL_PORT") or 587)) as s:
              s.starttls(context=ssl.create_default_context())
              s.login(os.environ["MAIL_USERNAME"], os.environ["MAIL_PASSWORD"])
              s.send_message(msg)
          PY
